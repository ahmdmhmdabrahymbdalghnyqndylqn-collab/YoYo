plugins { id 'com.android.application' }

android {
    namespace 'com.yoyo.privatechat'
    compileSdk 35
    buildToolsVersion '35.0.0'
    packaging { jniLibs { useLegacyPackaging = true } }

    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'String', 'OWNER_ENROLLMENT', '"' + (System.getenv('YOYO_OWNER_ENROLLMENT') ?: '') + '"'
        buildConfigField 'String', 'GUEST_DOWNLOAD_URL', '"' + (System.getenv('YOYO_GUEST_DOWNLOAD_URL') ?: 'https://github.com/ahmdmhmdabrahymbdalghnyqndylqn-collab/YoYo/releases/download/yoyo-v1.5.0/YOYO-1.5.apk') + '"'
        applicationId 'com.yoyo.installfix3'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '2.0.0'
    }

    signingConfigs {
        stable {
            def signingPath = System.getenv('YOYO_SIGNING_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('YOYO_STORE_PASSWORD')
                keyAlias System.getenv('YOYO_KEY_ALIAS')
                keyPassword System.getenv('YOYO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('YOYO_SIGNING_FILE')) signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore','javax.net.ssl.trustStorePassword'].each { k ->
                if (System.getProperty(k)) systemProperty k, System.getProperty(k)
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
