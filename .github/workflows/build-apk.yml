name: Build YOYO stable APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: yoyo-stable-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore YOYO signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .signing/yoyo.jks
          key: yoyo-stable-signing-v1
      - name: Create signing key once
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .signing
          keytool -genkeypair -v -keystore .signing/yoyo.jks -storepass android -alias yoyo -keypass android -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=YOYO, O=YOYO, C=JO"
      - name: Build signed release APK
        env:
          YOYO_SIGNING_FILE: ${{ github.workspace }}/.signing/yoyo.jks
          YOYO_STORE_PASSWORD: android
          YOYO_KEY_PASSWORD: android
          YOYO_KEY_ALIAS: yoyo
        run: gradle :nativeapp:assembleRelease --stacktrace
      - name: Verify signed APK
        shell: bash
        run: |
          APK=nativeapp/build/outputs/apk/release/nativeapp-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 20

      - name: Prepare APK
        run: cp nativeapp/build/outputs/apk/release/nativeapp-release.apk YOYO-FIX.apk

      - name: Upload install test artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOYO-FIX
          path: YOYO-FIX.apk
          retention-days: 7
      - name: Publish YOYO FIX
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete yoyo-fix-install --yes --cleanup-tag || true
          gh release create yoyo-fix-install YOYO-FIX.apk --target "$GITHUB_SHA" --title "YOYO FIX" --notes "Android 6+ build with update checks."
