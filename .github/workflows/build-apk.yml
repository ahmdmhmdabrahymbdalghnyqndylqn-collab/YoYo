name: Build YOYO 1.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle :nativeapp:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp nativeapp/build/outputs/apk/debug/nativeapp-debug.apk YOYO-1.0.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete yoyo-v1.0.0 --yes --cleanup-tag || true
          gh release create yoyo-v1.0.0 YOYO-1.0.apk \
            --target "$GITHUB_SHA" \
            --title "YOYO 1.0" \
            --notes "Fresh installable Android build of YOYO 1.0."
