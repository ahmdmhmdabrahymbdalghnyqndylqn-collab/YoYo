name: Build YoYo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 4 */3 * *'

permissions:
  contents: write
  actions: write

jobs:
  keep-signing-key-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Touch stable YoYo signing cache
        uses: actions/cache@v4
        with:
          path: .signing
          key: yoyo-signing-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable YoYo signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: yoyo-signing-v1

      - name: Create signing key once
        shell: bash
        run: |
          mkdir -p .signing
          if [ ! -f .signing/yoyo.jks ]; then
            PASS="$(openssl rand -hex 24)"
            printf '%s' "$PASS" > .signing/password.txt
            keytool -genkeypair -v               -keystore .signing/yoyo.jks               -storepass "$PASS"               -keypass "$PASS"               -alias yoyo               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=YoYo, OU=Private Chat, O=YoYo, L=Amman, C=JO"
          fi

      - name: Read app version
        shell: bash
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        shell: bash
        run: |
          PASS="$(cat .signing/password.txt)"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             YoYo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign             --ks .signing/yoyo.jks             --ks-key-alias yoyo             --ks-pass pass:"$PASS"             --key-pass pass:"$PASS"             --out YoYo.apk             YoYo-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose YoYo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YoYo-APK
          path: YoYo.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" YoYo.apk --clobber
          else
            gh release create "$TAG" YoYo.apk               --target "$GITHUB_SHA"               --title "YoYo $TAG"               --notes "YoYo Android release with persistent messaging, heads-up notifications, and automatic update delivery."
          fi
