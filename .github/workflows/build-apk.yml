name: Build YoYo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare YoYo APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YoYo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YoYo-APK
          path: YoYo.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 YoYo.apk --clobber
          else
            gh release create v1.0.0 YoYo.apk --target "$GITHUB_SHA" --title "YoYo v1.0.0" --notes "Android APK for YoYo private chat and audio calls."
          fi
