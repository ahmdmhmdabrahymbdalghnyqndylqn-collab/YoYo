name: Build native 0.3.3

on:
  workflow_dispatch:
  push:
    branches: [ native-0.3.3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack native source
        run: |
          rm -rf native-build
          mkdir native-build
          unzip -q native03-source.zip -d native-build
      - name: Build release APK
        working-directory: native-build/minproj
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: YOYO-native-0.3.3-unsigned
          path: native-build/minproj/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
